# ==================== COMPONENTS ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token. Obtain via /auth/login

  schemas:
    # ========== ACTION CENTER (#429) ==========
    ActionItem:
      type: object
      description: >
        One thing the caller needs to act on. Assembled on read from an existing
        record; it has no table of its own and no lifecycle.
      required:
        - id
        - type
        - title
        - subject_resource_type
        - subject_resource_id
        - deep_link
        - category_rank
        - tenant_id
      properties:
        id:
          type: string
          description: >
            Stable composite id, "<source>:<uuid>" (e.g. "mitigation:8f1e...").
            Namespaced because two categories can otherwise carry the same
            underlying uuid, and React would then see duplicate keys.
          example: mitigation:8f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0
        type:
          type: string
          enum:
            - overdue_mitigation
            - critical_risk
            - pending_approval
            - open_incident
            - expiring_evidence
            - overdue_remediation
        title:
          type: string
          description: The underlying record's own title, never a generated sentence.
        subject_resource_type:
          type: string
          enum: [mitigation, risk, approval_request, incident, evidence, remediation_plan]
        subject_resource_id:
          type: string
          description: The record's own id. A uuid for every type except incident, which is an integer rendered as a string.
        deep_link:
          type: string
          description: >
            Relative frontend path that resolves to a real route. Detail pages
            take the id in the path (/risks/mitigations/{id}); risks and evidence
            have no detail page and open the universal entity drawer instead
            (/risks?drawer=risk&entity={id}).
          example: /risks/mitigations/8f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Due date, expiry or approval deadline, depending on the type. Null when the category has no date.
        category_rank:
          type: integer
          minimum: 1
          maximum: 6
          description: >
            1 overdue_mitigation, 2 critical_risk, 3 pending_approval,
            4 open_incident, 5 expiring_evidence, 6 overdue_remediation.
            This is the primary sort key, exposed so a client can group without
            re-deriving the rule.
        tenant_id:
          type: string
          format: uuid
    ActionCenterResponse:
      type: object
      required: [data, generated_at, limit, offset, total]
      properties:
        data:
          type: array
          description: Always an array. Empty when nothing is outstanding.
          items:
            $ref: '#/components/schemas/ActionItem'
        generated_at:
          type: string
          format: date-time
          description: When the aggregation ran. The list is a live read, so this is its as-of instant.
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          description: Total outstanding items for this caller, not the size of this page.

    # ========== FINANCIAL QUANTIFICATION (spec §9) ==========
    Money:
      type: object
      description: An amount in both currencies (XAF canonical, USD derived).
      required: [xaf, usd]
      properties:
        xaf:
          type: number
        usd:
          type: number
    FinancialAssessment:
      type: object
      description: Full monetary view of a single risk (pkg/crq).
      required:
        - sle
        - sle_average
        - sle_worst
        - downtime_cost
        - sle_basis
        - aro
        - ale
        - ale_average
        - ale_worst
        - ale_basis
        - remediation_cost
        - mitigation_effectiveness
        - ale_after
        - risk_reduction
        - rosi
        - rosi_computable
      properties:
        sle: { $ref: '#/components/schemas/Money' }
        sle_average: { $ref: '#/components/schemas/Money' }
        sle_worst: { $ref: '#/components/schemas/Money' }
        downtime_cost: { $ref: '#/components/schemas/Money' }
        sle_basis:
          type: string
          enum: [explicit, composed, reference]
        aro:
          type: number
        ale: { $ref: '#/components/schemas/Money' }
        ale_average: { $ref: '#/components/schemas/Money' }
        ale_worst: { $ref: '#/components/schemas/Money' }
        ale_basis:
          type: string
          enum: [explicit, reference]
        remediation_cost: { $ref: '#/components/schemas/Money' }
        mitigation_effectiveness:
          type: number
          description: "[0,1] share of ALE removed by the control"
        ale_after: { $ref: '#/components/schemas/Money' }
        risk_reduction: { $ref: '#/components/schemas/Money' }
        rosi:
          type: number
          description: "Return on Security Investment ratio (e.g. 1.5 = +150%)"
        rosi_computable:
          type: boolean
          description: false when remediation cost <= 0 (ratio undefined)
    SimulateFinancialInput:
      type: object
      description: Per-field overrides for a what-if scenario (all optional).
      properties:
        sle_xaf: { type: number, minimum: 0 }
        aro: { type: number, minimum: 0 }
        downtime_hours: { type: number, minimum: 0 }
        hourly_downtime_cost_xaf: { type: number, minimum: 0 }
        data_loss_cost_xaf: { type: number, minimum: 0 }
        fines_xaf: { type: number, minimum: 0 }
        other_direct_cost_xaf: { type: number, minimum: 0 }
        remediation_cost_xaf: { type: number, minimum: 0 }
        mitigation_effectiveness: { type: number, minimum: 0, maximum: 1 }
    SmartFactorScore:
      type: object
      description: One factor's contribution to the multifactor smart score (spec §8).
      required: [key, label, weight, value, contribution, detail]
      properties:
        key:
          type: string
          enum:
            - business_criticality
            - internet_exposure
            - vulnerabilities
            - control_maturity
            - incident_history
            - exploitability
            - financial_value
            - threat_intel
        label: { type: string, description: Human-readable factor name }
        weight: { type: number, description: "Normalised weight applied, 0 to 1" }
        value: { type: number, description: "Risk contribution of the factor, 0 to 1 (1 = worst)" }
        contribution: { type: number, description: "Points this factor adds (value x weight x 100)" }
        detail: { type: string, description: Short human explanation of the raw inputs }
    SmartRiskScore:
      type: object
      description: The multifactor smart risk score plus its radar-ready breakdown.
      required: [score, criticality, factors, explanation]
      properties:
        score: { type: number, description: 0–100 composite score }
        criticality:
          type: string
          enum: [low, medium, high, critical]
        factors:
          type: array
          items: { $ref: '#/components/schemas/SmartFactorScore' }
        explanation: { type: string, description: Sentence naming the top drivers }
    FactorWeightsInput:
      type: object
      description: >
        The eight configurable factor weights. Relative values (the engine
        normalises them); each in [0,1], at least one > 0.
      required:
        - business_criticality
        - internet_exposure
        - vulnerabilities
        - control_maturity
        - incident_history
        - exploitability
        - financial_value
        - threat_intel
      properties:
        business_criticality: { type: number, minimum: 0, maximum: 1 }
        internet_exposure: { type: number, minimum: 0, maximum: 1 }
        vulnerabilities: { type: number, minimum: 0, maximum: 1 }
        control_maturity: { type: number, minimum: 0, maximum: 1 }
        incident_history: { type: number, minimum: 0, maximum: 1 }
        exploitability: { type: number, minimum: 0, maximum: 1 }
        financial_value: { type: number, minimum: 0, maximum: 1 }
        threat_intel: { type: number, minimum: 0, maximum: 1 }
    RiskScoringWeights:
      type: object
      description: A tenant's persisted smart-risk factor weights.
      required:
        - business_criticality
        - internet_exposure
        - vulnerabilities
        - control_maturity
        - incident_history
        - exploitability
        - financial_value
        - threat_intel
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        business_criticality: { type: number }
        internet_exposure: { type: number }
        vulnerabilities: { type: number }
        control_maturity: { type: number }
        incident_history: { type: number }
        exploitability: { type: number }
        financial_value: { type: number }
        threat_intel: { type: number }
        updated_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CriticalityBucket:
      type: object
      required: [criticality, count, ale]
      properties:
        criticality: { type: string }
        count: { type: integer }
        ale: { $ref: '#/components/schemas/Money' }
    TopRiskFinancial:
      type: object
      required: [id, title, criticality, ale, ale_worst, rosi, rosi_computable]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        criticality: { type: string }
        ale: { $ref: '#/components/schemas/Money' }
        ale_worst: { $ref: '#/components/schemas/Money' }
        rosi: { type: number }
        rosi_computable: { type: boolean }
    FinancialSummary:
      type: object
      description: Tenant-wide financial posture for the CFO/CISO dashboard.
      required:
        - currency
        - xaf_per_usd
        - total_risks
        - quantified_risks
        - total_ale
        - total_ale_worst
        - total_ale_after
        - total_risk_reduction
        - total_remediation
        - portfolio_rosi
        - portfolio_rosi_computable
        - by_criticality
        - top_risks
      properties:
        currency: { type: string }
        xaf_per_usd: { type: number }
        total_risks: { type: integer }
        quantified_risks: { type: integer }
        total_ale: { $ref: '#/components/schemas/Money' }
        total_ale_worst: { $ref: '#/components/schemas/Money' }
        total_ale_after: { $ref: '#/components/schemas/Money' }
        total_risk_reduction: { $ref: '#/components/schemas/Money' }
        total_remediation: { $ref: '#/components/schemas/Money' }
        portfolio_rosi: { type: number }
        portfolio_rosi_computable: { type: boolean }
        by_criticality:
          type: array
          items: { $ref: '#/components/schemas/CriticalityBucket' }
        top_risks:
          type: array
          items: { $ref: '#/components/schemas/TopRiskFinancial' }

    # ========== INPUT SCHEMAS ==========
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: password123

    CreateRiskInput:
      type: object
      required:
        - title
        - impact
        - probability
      properties:
        title:
          type: string
          minLength: 3
          example: "Data breach risk"
        description:
          type: string
          example: "Unauthorized access to sensitive customer data"
        impact:
          type: integer
          minimum: 1
          maximum: 5
          description: Impact level (1-5)
          example: 5
        probability:
          type: integer
          minimum: 1
          maximum: 5
          description: Probability level (1-5)
          example: 3
        tags:
          type: array
          items:
            type: string
          example: ["security", "data-protection"]
        asset_ids:
          type: array
          items:
            type: string
            format: uuid
        framework:
          type: string
          enum: [ISO27001, CIS, NIST, OWASP]
          example: ISO27001

    UpdateRiskInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        impact:
          type: integer
          minimum: 1
          maximum: 5
        probability:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
        asset_ids:
          type: array
          items:
            type: string
            format: uuid

    CreateMitigationInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 3
          example: "Implement encryption"
        assignee:
          type: string
          example: "security-team@example.com"
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 50
        cost:
          type: string
          example: "High"
        mitigation_time:
          type: string
          example: "2025-12-31"
        due_date:
          type: string
          format: date
          example: "2025-12-31"

    UpdateMitigationInput:
      type: object
      properties:
        title:
          type: string
        assignee:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        cost:
          type: string
        mitigation_time:
          type: string
        due_date:
          type: string
          format: date

    CreateSubActionInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          example: "Install security patches"

    CreateAssetInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: "Production Database Server"
        type:
          type: string
          enum: [Server, Application, Cloud, Database, SaaS, Storage, Network, Laptop, Data, User, Supplier]
          example: Database
        criticality:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          example: CRITICAL
        owner:
          type: string
          example: "DBA Team"
        external_id:
          type: string
          example: "db-prod-001"
        category:
          type: string
          enum: [server, workstation, application, database, network, cloud, vendor, data_processing]
        attributes:
          type: object
          additionalProperties: true
          description: >-
            Typed attribute values. Requires a category — without one there is no
            schema to validate them against, and they are rejected.

    UpdateAssetInput:
      type: object
      description: Partial update — omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [Server, Application, Cloud, Database, SaaS, Storage, Network, Laptop, Data, User, Supplier]
        criticality:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        owner:
          type: string
        category:
          type: string
          enum: [server, workstation, application, database, network, cloud, vendor, data_processing]
        attributes:
          type: object
          additionalProperties: true
          description: >-
            When present, REPLACES the whole attribute bag (it is validated as a
            whole, so a partial merge could drop a required attribute without the
            validator seeing its absence).

    # ========== RESPONSE SCHEMAS ==========
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Bearer token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'
        mfa:
          $ref: '#/components/schemas/MFAStatus'

    MFAStatus:
      type: object
      description: >-
        The resolved MFA requirement for the authenticated member (OR26-03).
        Carries no secret material: no TOTP seed, no QR payload, no backup codes.
      required: [state, configured, required, privileged, grace_period_active, grace_days]
      properties:
        state:
          type: string
          enum: [configured, recommended, grace_active, grace_expiring, required]
          description: >-
            configured — an authenticator is enrolled. recommended — not
            enrolled, not privileged; encouraged, never enforced. grace_active /
            grace_expiring — privileged and still able to defer, the second
            within 48h of the deadline. required — the server refuses protected
            access until an authenticator exists.
        configured:
          type: boolean
        required:
          type: boolean
          description: When true, protected routes answer 403 MFA_ENROLLMENT_REQUIRED.
        privileged:
          type: boolean
          description: Whether the mandate applies to this member at all.
        grace_period_active:
          type: boolean
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Absent for a member the mandate does not apply to, and for an enrolled one.
        grace_days:
          type: integer
          description: The tenant's configured window, echoed so the UI needs no second call.

    MFAPolicy:
      type: object
      required: [grace_days, configured, min_days, max_days, default_days, privileged_org_roles, privileged_business_roles]
      properties:
        grace_days:
          type: integer
          minimum: 0
          maximum: 90
          description: Days a privileged member may defer enrolment. 0 = required immediately.
        configured:
          type: boolean
          description: >-
            False when the tenant has never saved the setting, so the screen can
            say "using the default" rather than imply somebody chose it.
        updated_by_id:
          type: string
          format: uuid
          nullable: true
        min_days:
          type: integer
        max_days:
          type: integer
        default_days:
          type: integer
        privileged_org_roles:
          type: array
          items:
            type: string
        privileged_business_roles:
          type: array
          items:
            type: string

    UpdateMFAPolicyInput:
      type: object
      required: [grace_days]
      properties:
        grace_days:
          type: integer
          minimum: 0
          maximum: 90

