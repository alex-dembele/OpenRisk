        user. Rows from another tenant answer 404, identical to fabricated ids.

        The action is fixed by the route, not read from the body, so this
        endpoint's permission always matches what it performs. Requires
        `vulnerabilities:delete`.
      operationId: vulnerabilitiesBulkDelete
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApplyInput'
      responses:
        '200':
          description: The batch was applied in full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '400': {description: Validation error — empty selection, over 100 items, or an invalid status}
        '403': {description: The caller lacks vulnerabilities:delete, or the session carries no tenant}
        '404': {description: An id did not resolve — absent, or another tenant's, deliberately indistinguishable. Nothing was modified.}
        '409': {description: The selection changed since it was previewed. Nothing was modified.}

  /assets/bulk/capabilities:
    get:
      tags: [Assets]
      summary: Which bulk actions this register supports
      description: >-
        A compiled-in vocabulary, identical for every tenant, so the bulk bar
        never offers an action the server would refuse. No table is read.
