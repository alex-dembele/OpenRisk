          type: string
          description: Folded onto the four-type topology vocabulary.
          enum: [depends_on, hosted_on, connects_to, processes_data_of]
        raw_type:
          type: string
          description: The stored relation before folding (e.g. runs_on).
        description:
          type: string

    TopologyZone:
      type: object
      required: [key, label, count]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer

    AssetTopology:
      type: object
      required: [nodes, edges, zones, truncated]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TopologyNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TopologyEdge'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/TopologyZone'
        truncated:
          type: boolean
          description: >-
            True when the node cap bit. Reported rather than silently trimming —
            a topology missing nodes without saying so is worse than a slow one.
        node_limit:
          type: integer

    ChainHop:
      type: object
      required: [asset_id, depth]
      properties:
        asset_id:
          type: string
          format: uuid
        depth:
          type: integer

    CompromiseChain:
      type: object
      description: >-
        What follows from an asset being compromised. `impacted` are the assets
        that depend on it (what breaks); `reachable` are the assets it depends on
        or connects to (where an attacker moves next).
      required: [origin_id, impacted, reachable, edge_ids]
      properties:
        origin_id:
          type: string
          format: uuid
        impacted:
          type: array
          items:
            $ref: '#/components/schemas/ChainHop'
        reachable:
          type: array
          items:
            $ref: '#/components/schemas/ChainHop'
        edge_ids:
          type: array
          items:
            type: string
            format: uuid

    AssetSnapshot:
      type: object
      description: >-
        An asset's state captured immediately before an update or deletion.
        Answers "qui a modifié quoi, et quand": the prior field values (quoi),
        created_at (quand) and changed_by / changed_by_email (qui).
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        criticality:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        owner:
          type: string
        reason:
          type: string
          enum: [update, delete]
        changed_by:
          type: string
          format: uuid
          description: >-
            ID of the user who performed the change that superseded this state.
            All-zero UUID when the actor is unknown (legacy rows) or a
            non-interactive/system change.
        changed_by_email:
          type: string
          description: >-
            Computed display label for changed_by (resolved on read). Absent when
            the actor is unknown or could not be resolved.
        created_at:
          type: string
          format: date-time

    AssetDependency:
      type: object
      description: >-
        A directed edge in the tenant's asset dependency graph:
        source_asset depends on target_asset (read "source <type> target").
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        source_asset_id:
          type: string
          format: uuid
        target_asset_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [depends_on, runs_on, connects_to, hosted_by, stores_data_in, authenticates_via, backs_up_to, managed_by]
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAssetDependencyInput:
      type: object
      required:
        - source_asset_id
        - target_asset_id
      properties:
        source_asset_id:
          type: string
          format: uuid
        target_asset_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [depends_on, runs_on, connects_to, hosted_by, stores_data_in, authenticates_via, backs_up_to, managed_by]
          default: depends_on
        description:
          type: string

    DashboardStats:
      type: object
      properties:
        total_risks:
          type: integer
        open_risks:
          type: integer
        mitigated_risks:
          type: integer
        accepted_risks:
          type: integer
        closed_risks:
          type: integer
        average_risk_score:
          type: number
          format: float
        critical_assets:
          type: integer
        recent_risks:
          type: array
          items:
            $ref: '#/components/schemas/Risk'

    GamificationProfile:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        points:
          type: integer
        level:
          type: integer
        badges:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              earned_at:
                type: string
                format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BulkRiskActionInput:
      type: object
      required:
        - type
        - risk_ids
      properties:
        type:
          type: string
          enum: [change_status, assign_to, add_tags, remove_tags, delete]
        risk_ids:
          type: array
          minItems: 1
          maxItems: 100
          description: Repeated ids are de-duplicated before the batch runs.
          items:
            type: string
            format: uuid
        status:
          type: string
          description: Required for change_status.
        assign_to_id:
          type: string
          format: uuid
          description: Required for assign_to.
        tags:
          type: array
          description: Required for add_tags and remove_tags. Removing an absent tag is a no-op.
          items:
            type: string
        justification:
          type: string
          description: Recorded on each audit entry.

    BulkRiskActionResult:
      type: object
      required:
        - total
        - applied
        - risk_ids
        - audited
      properties:
        total:
          type: integer
          description: How many distinct risks were named.
        applied:
          type: integer
          description: >-
            Equals total on success. A failure is an HTTP error, not a partial
            number, so this is never a shortfall.
        risk_ids:
          type: array
          items:
            type: string
            format: uuid
        audited:
          type: integer
          description: >-
            Audit entries written. Below applied only if the trail was
            unavailable; the mutation still happened, and the gap is reported
            rather than hidden.

    BulkCapabilities:
      type: object
      properties:
        entity_type:
          type: string
          example: vulnerability
        actions:
          type: array
          description: >-
            Only the actions this register can actually perform. Assets expose
            delete alone — domain.Asset has no Status, no Tags, and a free-text
            Owner, so nothing else from the frozen action set maps onto it.
          items:
            type: string
            enum: [change_status, delete]

    BulkPreviewInput:
      type: object
      required: [action, ids]
      properties:
        action:
          type: string
          enum: [change_status, delete]
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, format: uuid}
        status:
          type: string
          description: The target value, for change_status.

    BulkApplyInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          description: Repeated ids are de-duplicated before the batch runs.
          items: {type: string, format: uuid}
        status:
          type: string
          description: The target value, for the change-status route.
        justification:
          type: string
          maxLength: 1000
          description: Recorded on every audit entry the change produces.
        fingerprint:
          type: string
          description: >-
            The value returned by the preview. When present it must still match
            the selection's current state, or the request is refused with 409.
            Omit it to apply without previewing.

    BulkSampleChange:
      type: object
      properties:
        id: {type: string, format: uuid}
        label:
          type: string
          description: How the row reads to a human — a CVE id, an asset name — never a uuid.
        before: {type: object, additionalProperties: true}
        after: {type: object, additionalProperties: true}
        changed_fields:
          type: array
          items: {type: string}

    BulkPreview:
      type: object
      properties:
        requested:
          type: integer
          description: How many distinct ids the caller named.
        found:
          type: integer
          description: How many exist in this tenant. A shortfall is what would fail the apply.
        missing:
          type: array
          description: >-
            Ids that did not resolve — stale selections, or another tenant's,
            deliberately not distinguished.
          items: {type: string, format: uuid}
        affected:
          type: integer
          description: >-
            How many rows the change would actually alter. Lower than `found`
            when a row already holds the target value.
        unchanged:
          type: integer
        sample:
          type: array
          description: A bounded list (10) of exactly what would change.
          items:
            $ref: '#/components/schemas/BulkSampleChange'
        fingerprint:
          type: string
          description: Pass to the apply call to detect a selection that moved.
        action:
          type: string
          enum: [change_status, delete]

    BulkResult:
      type: object
      properties:
        total: {type: integer}
        applied:
          type: integer
          description: Equals total on success. A failure is an HTTP error, never a partial number.
        ids:
          type: array
          items: {type: string, format: uuid}
        audited:
          type: integer
          description: >-
            Audit entries written. Below `applied` only if the trail was
            unavailable; the mutation still happened and the gap is reported.

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid input"
        code:
          type: integer
          example: 400
        details:
          type: object
