      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized

  # ==================== GAMIFICATION ====================
  /gamification/me:
    get:
      tags:
        - Gamification
      summary: Get current user's gamification profile
      operationId: getGamificationProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gamification profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamificationProfile'
        '401':
          description: Unauthorized

  /action-center:
    get:
      tags:
        - Action Center
      summary: Prioritised outstanding work for the caller
      description: >
        Returns the items the caller can personally act on right now, ordered by
        category rank then by that category's own secondary key. A live read over
        risks, mitigations, incidents, evidence, remediation plans and approvals —
        nothing is persisted and there is no dismiss: an item disappears when the
        underlying work is done.


        Which categories are returned depends on the caller's business role.
        Pending approvals are NOT role-gated: they are evaluated per request
        against the current step's approver, so a caller who is the named
        approver always sees them, and a caller who would be refused at the
        Approve button never does.
      operationId: getActionCenter
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size. Defaults to 20, clamped to 100.
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          description: Rows to skip. A negative value is rejected with 400.
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: The caller's prioritised action items, possibly empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionCenterResponse'
        '400':
          description: Invalid offset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== RISK BULK ACTIONS (#581) ====================
  /risks/bulk:
    post:
      tags:
        - Risks
      summary: Apply one action to many risks, all or none
      description: >-
        All-or-nothing (decision D-036). Either every named risk is modified or
        none is: the batch runs in a single transaction, and one stale, foreign
        or otherwise unresolvable id fails the whole request without writing
        anything. There is deliberately no per-item outcome to report.

        One audit entry is written per modified risk, carrying the acting user.

        A risk id belonging to another tenant answers 404 — identical to a
        fabricated id — because the tenant predicate is part of the row load.
      operationId: bulkRiskAction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRiskActionInput'
      responses:
        '200':
          description: The batch was applied in full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRiskActionResult'
        '400':
          description: >-
            Validation error — empty selection, more than 100 items, an unknown
            action type, or a missing action parameter.
        '401':
          description: Unauthorized
        '403':
          description: The caller lacks risks:update, or the session carries no tenant
        '404':
          description: >-
            At least one id could not be resolved — absent, or belonging to
            another tenant, deliberately indistinguishable. Nothing was modified.

  # ==================== GOVERNED BULK OPERATIONS (#582) ====================

  /vulnerabilities/bulk/capabilities:
    get:
      tags: [Vulnerabilities]
      summary: Which bulk actions this register supports
      description: >-
        A compiled-in vocabulary, identical for every tenant, so the bulk bar
        never offers an action the server would refuse. No table is read.
      operationId: vulnerabilitiesBulkCapabilities
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The supported actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCapabilities'
        '403': {description: The caller lacks read access to this register}

  /vulnerabilities/bulk/preview:
    post:
      tags: [Vulnerabilities]
      summary: What a bulk action would change — mutates nothing
      description: >-
        Returns the affected count and a bounded sample of exactly what would
        change, and writes nothing. Also returns a `fingerprint`: send it back
        with the apply and a selection that moved underneath the user is refused
        with 409 rather than silently applied to the new set.

        Behind the register's read permission — it discloses only the current
        state of rows the caller can already fetch individually.
      operationId: vulnerabilitiesBulkPreview
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPreviewInput'
      responses:
        '200':
          description: The impact statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPreview'
        '400': {description: Validation error}
        '403': {description: The caller lacks read access, or the session carries no tenant}

  /vulnerabilities/bulk/change-status:
    post:
      tags: [Vulnerabilities]
      summary: Apply "change_status" to many rows, all or none
      description: >-
        All-or-nothing (decision D-036): either every named row is changed or
        none is. One audit entry is written per modified row, carrying the acting
        user. Rows from another tenant answer 404, identical to fabricated ids.

        The action is fixed by the route, not read from the body, so this
        endpoint's permission always matches what it performs. Requires
        `vulnerabilities:update`.
      operationId: vulnerabilitiesBulkChangeStatus
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApplyInput'
      responses:
        '200':
          description: The batch was applied in full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '400': {description: Validation error — empty selection, over 100 items, or an invalid status}
        '403': {description: The caller lacks vulnerabilities:update, or the session carries no tenant}
        '404': {description: An id did not resolve — absent, or another tenant's, deliberately indistinguishable. Nothing was modified.}
        '409': {description: The selection changed since it was previewed. Nothing was modified.}

  /vulnerabilities/bulk/delete:
    post:
      tags: [Vulnerabilities]
      summary: Apply "delete" to many rows, all or none
      description: >-
        All-or-nothing (decision D-036): either every named row is changed or
