  /compliance/controls/{controlId}/evidences:
    get:
      tags: [Compliance]
      summary: List evidence attached to a control
      operationId: listComplianceEvidences
      security: [{ bearerAuth: [] }]
      parameters:
        - name: controlId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ControlEvidence'
    post:
      tags: [Compliance]
      summary: Upload a file as evidence for a control
      operationId: createComplianceEvidence
      security: [{ bearerAuth: [] }]
      parameters:
        - name: controlId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
      responses:
        '201':
          description: Evidence uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlEvidence'
        '400':
