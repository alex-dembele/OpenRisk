groups:
  - name: openrisk_performance
    interval: 30s
    rules:
      # ===== CACHE ALERTS =====
      - alert: LowCacheHitRate
        expr: openrisk_cache_hit_rate < 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate detected"
          description: "Cache hit rate is {{ $value }}% (threshold: 75%)"

      - alert: CriticalLowCacheHitRate
        expr: openrisk_cache_hit_rate < 50
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical cache hit rate"
          description: "Cache hit rate is {{ $value }}% (critical threshold: 50%)"

      # ===== REDIS ALERTS =====
      - alert: HighRedisMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | humanizePercentage }} of allocated memory"

      - alert: RedisConnectionErrors
        expr: increase(redis_commands_failed_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis connection errors detected"
          description: "Redis has {{ $value }} connection errors in the last 5 minutes"

      # ===== DATABASE ALERTS =====
      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 40
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool near capacity"
          description: "{{ $value }} database connections active (max: 50)"

      - alert: CriticalDatabaseConnections
        expr: pg_stat_activity_count > 48
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool critical"
          description: "{{ $value }} connections active - pool nearly full (max: 50)"

      - alert: SlowDatabaseQueries
        expr: rate(pg_stat_statements_mean_time[5m]) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time: {{ $value }}ms (threshold: 1000ms)"

      - alert: HighDatabaseErrors
        expr: increase(pg_errors[5m]) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Database errors detected"
          description: "{{ $value }} database errors in the last 5 minutes"

      # ===== API PERFORMANCE ALERTS =====
      - alert: HighAPIErrorRate
        expr: |
          (increase(openrisk_http_errors_total[5m]) / 
           increase(openrisk_http_requests_total[5m])) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "API error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      - alert: CriticalAPIErrorRate
        expr: |
          (increase(openrisk_http_errors_total[2m]) / 
           increase(openrisk_http_requests_total[2m])) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical API error rate"
          description: "API error rate is {{ $value | humanizePercentage }} (critical: 10%)"

      - alert: HighAPILatency
        expr: histogram_quantile(0.95, openrisk_http_request_duration_seconds) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency: {{ $value }}s (threshold: 2s)"

      - alert: CriticalAPILatency
        expr: histogram_quantile(0.99, openrisk_http_request_duration_seconds) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical API latency"
          description: "99th percentile latency: {{ $value }}s (critical: 5s)"

      # ===== APPLICATION METRICS ALERTS =====
      - alert: HighMemoryUsage
        expr: openrisk_go_memory_alloc_bytes / (1024*1024*1024) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High application memory usage"
          description: "Memory usage: {{ $value | humanize }}GB (threshold: 1GB)"

      - alert: TooManyGoroutines
        expr: openrisk_go_goroutines > 10000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Excessive goroutine count"
          description: "{{ $value }} goroutines running (threshold: 10000)"

      - alert: AppDown
        expr: up{job="openrisk-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenRisk backend is down"
          description: "OpenRisk backend has been down for more than 1 minute"

      # ===== LOGIN & SECURITY ALERTS =====
      - alert: HighLoginFailureRate
        expr: |
          (increase(openrisk_login_failures_total[10m]) /
           increase(openrisk_login_attempts_total[10m])) > 0.3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High login failure rate"
          description: "Login failure rate: {{ $value | humanizePercentage }} (threshold: 30%)"

      - alert: PossibleBruteForceAttack
        expr: increase(openrisk_login_failures_total[5m]) > 20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Possible brute force attack detected"
          description: "{{ $value }} failed login attempts in the last 5 minutes"

      # ===== BUSINESS METRICS ALERTS =====
      - alert: NoActiveUsers
        expr: openrisk_active_users == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No active users detected"
          description: "The system has reported 0 active users"

      - alert: MitigationsDueAlert
        expr: openrisk_mitigations_due_soon > 10
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Upcoming mitigations due"
          description: "{{ $value }} mitigations are due in the next 7 days"

      # ===== ACTIVATION / TIME-TO-AHA ALERTS =====
      # The product promise is "a newcomer reaches the Aha moment in under
      # 8 minutes" (first cyber score on their own data, with at least one
      # compliance gap identified). The alert fires at 12 minutes so there is
      # headroom between the target and the page — an alert set at the target
      # fires on every ordinary bad day and gets muted.
      #
      # The `aha_definition="v2"` selector is not optional (D-010). The Aha moved
      # from the executive-dashboard score computation (v1) to the Posture Reveal
      # (v2); the two measure different journeys, so a quantile over both would
      # step at the switch for a reason that has nothing to do with the product
      # getting slower. v2 starts empty — a histogram with no observations has no
      # quantile, so this alert is simply silent until the first reveal lands.
      - alert: SlowTimeToAha
        expr: histogram_quantile(0.5, sum(rate(openrisk_time_to_aha_seconds_bucket{aha_definition="v2"}[6h])) by (le)) > 720
        for: 30m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "Median time-to-Aha above 12 minutes"
          description: "P50 time-to-Aha is {{ $value | humanizeDuration }} (target < 8 min, alert > 12 min). New signups are not reaching first value: check the onboarding wizard, the framework import and the guided first risk."

      # An empty numerator here means signups are happening but nobody is
      # activating — a harder failure than a slow P50, and invisible to the
      # quantile alert above (a histogram with no observations has no quantile).
      - alert: NoActivationDespiteSignups
        expr: increase(openrisk_activation_events_total{event_key="signup"}[6h]) > 0 and increase(openrisk_aha_reached_total[6h]) == 0
        for: 1h
        labels:
          severity: warning
          team: product
        annotations:
          summary: "Signups with zero Aha moments"
          description: "{{ $value }} signups in the last 6h and not one reached the Aha moment."

  # =========================================================================
  # Realtime event hub (W0-07)
  # =========================================================================
  #
  # The hub's failure mode is silence: a stream that stops delivering looks
  # exactly like a tenant where nothing is happening. Every rule below is
  # therefore about the DIFFERENCE between those two, and none of them is
  # labelled by tenant — that would be unbounded cardinality, and the tenant is
  # in the structured logs where it belongs.
  - name: openrisk_realtime
    rules:
      # Events are being accepted but nothing is reaching a client while
      # connections are open. This is the "why does nobody see anything"
      # condition: a broken fanout, a relay that died, or a filter that excludes
      # everything.
      - alert: RealtimeEventsPublishedButNotDelivered
        expr: |
          sum(rate(openrisk_realtime_events_published_total[10m])) > 0
          and sum(openrisk_realtime_active_connections) > 0
          and sum(rate(openrisk_realtime_events_delivered_total[10m])) == 0
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Realtime events are published but never delivered"
          description: "Events are being accepted and clients are connected, yet nothing is being written to a stream. Check the Redis fanout and the relay; a stream that silently stops looks identical to a quiet tenant."

      # Publication is failing. Split by reason at the metric so the response is
      # obvious: `log` is the database, `fanout` is Redis, `invalid` is a code
      # defect that shipped.
      - alert: RealtimePublishFailures
        expr: sum(rate(openrisk_realtime_publish_failures_total[10m])) by (reason) > 0.1
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime publications failing ({{ $labels.reason }})"
          description: "{{ $value | printf \"%.2f\" }}/s publications failing with reason={{ $labels.reason }}. log = the durable append is failing and replay will have gaps; fanout = other instances are not seeing events; invalid = an event that does not satisfy the catalog is being published."

      # Sustained dropping means consumers cannot keep up. Every drop is followed
      # by a resync instruction, so this is not silent data loss — but a client
      # that resyncs continuously is refetching everything instead of streaming,
      # which is worse than not streaming at all.
      - alert: RealtimeConsumersFallingBehind
        expr: sum(rate(openrisk_realtime_events_dropped_total[15m])) > 1
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime subscribers are being dropped from"
          description: "{{ $value | printf \"%.2f\" }} events/s are being dropped because subscribers cannot keep up. Each drop triggers a client resync, so clients are refetching rather than streaming."

      # A connection count that only goes up is a leak: streams that ended but
      # whose goroutine and subscription were never released.
      - alert: RealtimeConnectionsNotReleased
        expr: |
          sum(openrisk_realtime_active_connections) > 100
          and sum(rate(openrisk_realtime_connection_duration_seconds_count[30m])) == 0
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime connections are not being released"
          description: "{{ $value }} streams are open and not one has closed in 30 minutes. Connections that end without being torn down hold a goroutine and a subscription each."

      # A reconnect storm: connections churning far faster than users could be
      # opening pages. Usually a deploy loop, a proxy killing idle connections
      # below the keepalive interval, or a client backoff that stopped backing
      # off.
      - alert: RealtimeReconnectStorm
        expr: |
          sum(rate(openrisk_realtime_subscriptions_total{outcome="accepted"}[5m])) > 20
          and histogram_quantile(0.5, sum(rate(openrisk_realtime_connection_duration_seconds_bucket[15m])) by (le)) < 30
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime reconnect storm"
          description: "Streams are being opened at {{ $value | printf \"%.1f\" }}/s and the median one lives under 30s. Check for a proxy idle timeout below the keepalive, or a client that stopped backing off."

      # Subscriptions refused for authorization. A handful is normal (a role
      # without read permissions loading the app); a sustained rate means a
      # permission change broke live updates for a whole population.
      - alert: RealtimeSubscriptionsRefused
        expr: sum(rate(openrisk_realtime_subscriptions_total{outcome=~"forbidden|capacity"}[15m])) by (outcome) > 0.5
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime subscriptions being refused ({{ $labels.outcome }})"
          description: "{{ $value | printf \"%.2f\" }}/s subscriptions refused with outcome={{ $labels.outcome }}. forbidden = a population lost the read permissions the stream requires; capacity = the instance connection limit is being hit and clients are being told to retry."

      # Cursors expiring means clients are away longer than the retention window
      # and must refetch everything on return. Either the window is too short
      # for how the product is used, or the retention sweep is deleting too
      # aggressively.
      - alert: RealtimeCursorsExpiring
        expr: sum(rate(openrisk_realtime_replays_total{outcome="expired"}[30m])) > 0.2
        for: 30m
        labels:
          severity: info
          team: platform
        annotations:
          summary: "Reconnecting clients are outside the replay window"
          description: "{{ $value | printf \"%.2f\" }}/s reconnects carry a cursor older than the retained history and are being told to resynchronise. Consider whether REALTIME_REPLAY_RETENTION_HOURS matches how long clients actually stay away."

      # End-to-end staleness: the number a user would recognise as "my screen is
      # behind". Measured from the business change, not from publication, so a
      # slow publisher shows up here too.
      - alert: RealtimeDeliveryLagHigh
        expr: histogram_quantile(0.95, sum(rate(openrisk_realtime_delivery_lag_seconds_bucket[10m])) by (le)) > 10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Realtime delivery lag above 10s (p95)"
          description: "P95 delay between a business change and it reaching a client socket is {{ $value | humanizeDuration }}. Screens are visibly behind the data."
