# OpenRisk — self-hosted deployment (Community Edition, AGPL-3.0)
#
# One command brings up the whole stack: `docker compose up -d`. Run
# `scripts/install.sh` first (or once) to generate the .env and the RSA keys the
# backend needs — after that this file works first-try with no manual steps.
#
# Services: postgres, redis, backend (single Go binary: API + workers), frontend.
# The test database from the dev compose is intentionally absent here.
#
# Aucun `container_name` : il fixait les noms à openrisk_db / openrisk_redis,
# déjà pris par la stack de développement du dépôt racine, donc `./install.sh`
# échouait sur une machine de développeur avec un conflit Docker peu clair
# (#328). Compose nomme désormais les conteneurs d'après le projet, les deux
# stacks coexistent, et tous les scripts adressent déjà les services par leur
# nom de service (`$DC exec -T db`), pas par nom de conteneur.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-openrisk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-openrisk}
    volumes:
      - openrisk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openrisk}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [openrisk]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - openrisk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [openrisk]
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: openrisk/backend:${OPENRISK_VERSION:-latest}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-openrisk}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-openrisk}
      REDIS_URL: redis://redis:6379/0
      PORT: 8080
      APP_ENV: production
      # APP_ENV=production makes the backend REFUSE TO BOOT rather than seed a
      # known default password (handler.SeedAdminUser). The installer generates
      # this into .env, so the first boot seeds a real administrator instead of
      # fatally looping.
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD in .env (scripts/install.sh generates it)}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # RS256 signing keys — generated by scripts/install.sh into ./secrets.
      RSA_PRIVATE_KEY_PATH: /app/secrets/private.pem
      RSA_PUBLIC_KEY_PATH: /app/secrets/public.pem
      # Encryption keys (generated by the installer).
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      SCANNER_CREDENTIAL_KEY: ${SCANNER_CREDENTIAL_KEY}
      AUDIT_EXPORT_KEY: ${AUDIT_EXPORT_KEY}
      # --- Open-core commercialisation (all optional) ---
      # Payment gateways. Empty ⇒ Free plan + manual upgrades (honest, no fake URL).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NOTCHPAY_PUBLIC_KEY: ${NOTCHPAY_PUBLIC_KEY:-}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      # Telemetry: opt-in in-app; set to "off" to hard-disable regardless of consent.
      OPENRISK_TELEMETRY: ${OPENRISK_TELEMETRY:-}
    volumes:
      - ./secrets:/app/secrets:ro
      - openrisk_exports:/app/uploads/exports
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [openrisk]
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: openrisk/frontend:${OPENRISK_VERSION:-latest}
    depends_on: [backend]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    networks: [openrisk]
    restart: unless-stopped

volumes:
  openrisk_data:
  openrisk_redis_data:
  openrisk_exports:

networks:
  openrisk:
    driver: bridge
