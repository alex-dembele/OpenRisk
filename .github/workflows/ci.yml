name: CI Pipeline

on:
  push:
    branches: [master, stag, develop]
  pull_request:
    branches: [master, stag, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== BACKEND TESTS ====================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build
        run: cd backend && go build ./...

      - name: Vet
        run: cd backend && go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m
          install-mode: goinstall

      - name: Check go mod tidy
        run: |
          cd backend
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy" && exit 1)

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: cd backend && go mod download

      - name: Run unit tests
        run: cd backend && go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      # The self-hosting capability table in docs/SELF_HOSTING.md is GENERATED
      # from pkg/entitlements (#328). That file lives outside the Go module, so
      # the test cache cannot see it change and a hand-edited table would pass
      # from cache — `-count=1` is what makes this gate real.
      - name: Published self-hosting matrix still matches the code
        run: cd backend && go test -count=1 ./pkg/entitlements/ -run TestSelfHostDoc

      - name: Check coverage threshold (50%)
        run: |
          cd backend
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print int($3)}')
          echo "Code coverage: ${COVERAGE}%"
          if [ ${COVERAGE} -lt 50 ]; then
            echo "❌ Coverage ${COVERAGE}% is below threshold 50%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.out
          flags: backend
          fail_ci_if_error: true

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openrisk_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: cd backend && go mod download

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/openrisk_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          APP_ENV: test
        run: cd backend && go test -v -race -tags=integration ./...

      - name: Check for test failures
        if: failure()
        run: echo "Integration tests failed"

  # ==================== FRONTEND TESTS ====================
  frontend-lint:
    name: Frontend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 20, not 18 (#341). Vite 7 and Vitest 4 both require >=20.19, so on
      # 18 this job and frontend-unit-tests failed at `npm ci`/run time on every
      # branch, for reasons that had nothing to do with the branch.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # The ESLint RATCHET, not a bare `eslint .` (#341, D-022).
      #
      # `npm run lint` reports 321 errors on a clean master. Running it as a
      # blocking gate makes every frontend PR red for reasons it did not cause,
      # which is how a red check stops meaning anything — #472 and #473 both
      # showed failures they had not introduced. Dropping the rules to 'warn'
      # was rejected instead: ABSOLUTE RULE 5 is "zero `any`".
      #
      # So the debt is frozen per-rule in frontend/.lint-ceiling.json and this
      # step fails only when a rule gets WORSE. Every rule not already in debt
      # is enforced at zero. See scripts/check-lint-ceiling.mjs.
      - name: ESLint ratchet (no rule may regress)
        run: cd frontend && npm run lint:ceiling

      - name: Check TypeScript
        run: cd frontend && npm run type-check

      # Formatting, BLOCKING and with no `||` (#505, D-027).
      #
      # The step that stood here until #341 ran
      # `npm run format:check || npm run format`. The `||` meant it could not
      # fail; both scripts, and Prettier itself, had never existed in this repo.
      # #341 deleted the pretence and escalated the real question as D-027,
      # which chose adoption. #505 added Prettier and swept 414 files, so this
      # is now a gate that can actually fail — and must, on an unformatted file.
      - name: Check code formatting (Prettier)
        run: cd frontend && npm run format:check

  # The design tokens carry two claims that were, until now, only assertions in
  # a comment: that every text/surface pair meets its WCAG target in both
  # themes, and that the product's values match the canonical design system
  # shared with the marketing site. check-contrast.mjs has said "run in CI"
  # since W1-01 while nothing ran it. Both are blocking here, because a token
  # value is exactly the kind of change that looks harmless in review.
  frontend-design-system:
    name: Frontend Design Tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Token contract in sync with the canonical design system
        run: cd frontend && npm run check:design-system

      - name: WCAG contrast, both themes and both accent variants
        run: cd frontend && npm run check:contrast

      # The two checks above read the token FILES. This one reads what the
      # browser computed, and it is the only one of the three that could have
      # caught #427: `bg-danger/10` emitted no CSS at all, so the tokens were in
      # sync, their contrast arithmetic was correct, and the class still did
      # nothing. Chromium only — the assertion is about which declarations exist,
      # not about pixels, so a second engine would buy nothing here.
      - name: Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Opacity modifiers resolve to real colours in a browser
        run: cd frontend && npx playwright test e2e/visual/alpha-modifiers.spec.ts --project=chromium

      # The three-licence boundary (#446). D-014 and D-016 put
      # frontend/design-system/ and frontend/src/shared/ds/ under Apache-2.0
      # while the core stays AGPL-3.0-only and the EE is commercial. #443 is
      # about to vendor ~50 third-party components into shared/ds, and
      # Apache-2.0 is irreversible once published, so the guarantee worth
      # automating is that a file cannot land there carrying the core's header.
      - name: Three-licence boundary is intact
        run: cd frontend && npm run check:license-boundary

      # The visual suite, which until #463 ran in NO workflow at all. e2e.yml
      # drives Playwright from the repo root against tests/e2e, so the
      # design-system gallery, the overlay snapshots and the language axis were
      # only ever executed on someone's laptop.
      #
      # It runs in THIS job rather than a new one because the browser is already
      # installed above for the opacity-modifier check, and because this job
      # depends on nothing that was failing when it was written — at the time,
      # `build-frontend` needed frontend-lint and frontend-unit-tests, both red,
      # so anything placed there was skipped and enforced by nobody. #341 made
      # those two jobs pass; this step stays here because it needs the browser
      # this job already installs.
      - name: Visual suite — themes, languages, axe and the keyboard contract
        run: cd frontend && npx playwright test e2e/visual/ --project=chromium

      # The bundle budget runs HERE as well as in build-frontend. It was
      # duplicated because build-frontend `needs: [frontend-lint,
      # frontend-unit-tests]`, both of which were red, so its budget step was
      # skipped on every run and the gate was enforced by nobody.
      #
      # This step was added by #462 and then LOST: #468 branched before #462
      # merged, rewrote this same job, and its version won the merge. Master then
      # sat at 180.4 KB — over its own budget — with nothing to notice. Restored
      # here, after the build the visual suite already needs.
      #
      # #341 unblocked both prerequisite jobs, so build-frontend now reaches its
      # own budget step. The duplicate is kept for one milestone as belt and
      # braces; drop it once CI has been observed green end to end.
      - name: Bundle budget (< 180 KB gzip initial)
        run: cd frontend && npm run build && npm run budget

      # anime.js (#445, D-028) is the second animation runtime in this bundle and
      # is admitted for one job: drawing SVG on entry, on lazily-routed screens.
      # This asserts it never reaches the preloaded graph — which is the whole
      # basis on which it was approved — and that its own chunk stays inside its
      # gzip ceiling. `npm run budget` above cannot see it: that gate counts only
      # preloaded JS, and anime.js is deliberately not in it.
      - name: anime.js stays lazy and within its ceiling
        run: cd frontend && npm run budget:anime

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: frontend/playwright-report/
          retention-days: 7

  # PROJECT_PLAN.md §3 requires a blocking `typecheck` gate. `npm run build`
  # already runs `tsc -b`, but we type-check on its own (no emit) as a fast,
  # dedicated gate that does not wait on a bundle.
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Typecheck (tsc -b --noEmit)
        run: cd frontend && npm run type-check

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 20 (#341) — see the note in frontend-lint.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # `npm run test` alone is `vitest` in WATCH mode; the --run came from the
      # command line, and the coverage flag needed @vitest/coverage-v8, which
      # was not a dependency until #341. The job therefore died with
      # `MISSING DEPENDENCY` on every branch and never reached the threshold
      # step below. Both are fixed: the script is `vitest run --coverage`.
      - name: Run tests with coverage
        run: cd frontend && npm run test:coverage -- --reporter=verbose

      # The thresholds themselves are enforced by Vitest (vitest.config.ts), so
      # the step above already fails on a coverage regression. This step exists
      # to PRINT the numbers, because the version it replaces asserted nothing:
      # it echoed "Frontend test coverage checked" and exited 0 while claiming
      # to be a 70% gate. The real figure is ~15%; see the ratchet note in
      # vitest.config.ts.
      - name: Report coverage
        run: |
          cd frontend
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::Coverage summary not produced — the coverage run did not complete."
            exit 1
          fi
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            for (const k of ['statements', 'branches', 'functions', 'lines'])
              console.log(k.padEnd(11), t[k].pct + '%', '(' + t[k].covered + '/' + t[k].total + ')');
          "

      # Best-effort, and NOT allowed to fail the job (#341).
      #
      # This repository has no CODECOV_TOKEN, so the upload is anonymous and
      # Codecov rate-limits it: the first run of this PR died on
      # `429 Rate limit reached ... Expected time to availability: 787s` with
      # `fail_ci_if_error: true`, after the tests and the coverage gate had both
      # passed. A third party's quota deciding whether our build is green is the
      # same defect this issue exists to remove.
      #
      # The coverage GATE is enforced by Vitest inside the step above, on our own
      # runner, so nothing is lost by making the upload advisory. Set a
      # CODECOV_TOKEN secret and this can go back to blocking.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==================== BUILD & DOCKER ====================
  build-backend:
    name: Build Backend Binary
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-unit-tests, backend-integration-tests]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build backend binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo \
            -ldflags="-w -s -X main.Version=${{ github.sha }}" \
            -o openrisk ./cmd/server
          ls -lh openrisk

      - name: Verify binary
        run: |
          cd backend
          file openrisk
          ./openrisk --version || echo "Binary built successfully"

      - name: Upload artifact
        # v3 was retired by GitHub and now fails at runtime (#341).
        uses: actions/upload-artifact@v4
        with:
          name: openrisk-backend-linux-amd64
          path: backend/openrisk
          retention-days: 5

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-unit-tests]
    steps:
      - uses: actions/checkout@v4
      # Node 20 (#341) — see the note in frontend-lint. This job is the gate
      # behind acceptance criterion 3 (`npm run build` succeeds), and on 18 it
      # could not have run the build at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_APP_NAME: OpenRisk
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Verify build output
        run: |
          cd frontend
          if [ ! -d dist ]; then
            echo "❌ Build failed - dist directory not found"
            exit 1
          fi
          echo "✅ Frontend build successful"
          ls -lah dist/

      # Performance budget (task §2) — BLOCKING. Fails the build if the initial
      # (preloaded) JS exceeds 180 KB gzipped — the design guide's target, met by
      # #462. Route/on-demand chunks excluded.
      - name: Enforce bundle-size budget (< 180 KB gzip initial)
        run: cd frontend && npm run budget

      - name: anime.js stays lazy and within its ceiling (#445)
        run: cd frontend && npm run budget:anime

      - name: Upload artifact
        # v3 was retired by GitHub and now fails at runtime (#341) — it aborts
        # the job at "Set up job", before the build ever starts, which is what
        # kept this job red once it became reachable at all.
        uses: actions/upload-artifact@v4
        with:
          name: openrisk-frontend-dist
          path: frontend/dist
          retention-days: 5

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-unit-tests]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref != 'refs/heads/develop' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== CODE COVERAGE REPORT ====================
  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-unit-tests]
    if: always()
    steps:
      - uses: actions/checkout@v3

      - name: Download backend coverage
        uses: actions/download-artifact@v3
        with:
          name: backend-coverage
        continue-on-error: true

      - name: Generate coverage badge
        run: |
          echo "Coverage Report"
          echo "Backend: Check Codecov"
          echo "Frontend: Check Codecov"

  # ==================== CI SUMMARY ====================
  ci-summary:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-unit-tests, backend-integration-tests, frontend-lint, frontend-typecheck, frontend-unit-tests, build-backend, build-frontend]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          echo "CI Pipeline Summary"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "Frontend Lint: ${{ needs.frontend-lint.result }}"
          echo "Frontend Unit Tests: ${{ needs.frontend-unit-tests.result }}"
          echo "Backend Build: ${{ needs.build-backend.result }}"
          echo "Frontend Build: ${{ needs.build-frontend.result }}"
          
          if [ "${{ needs.backend-lint.result }}" != "success" ]; then
            echo "Backend lint failed"
            exit 1
          fi
          if [ "${{ needs.backend-unit-tests.result }}" != "success" ]; then
            echo "Backend unit tests failed"
            exit 1
          fi
          if [ "${{ needs.backend-integration-tests.result }}" != "success" ]; then
            echo "Backend integration tests failed"
            exit 1
          fi
          if [ "${{ needs.frontend-lint.result }}" != "success" ]; then
            echo "Frontend lint failed"
            exit 1
          fi
          if [ "${{ needs.frontend-typecheck.result }}" != "success" ]; then
            echo "Frontend typecheck failed"
            exit 1
          fi
          if [ "${{ needs.frontend-unit-tests.result }}" != "success" ]; then
            echo "Frontend unit tests failed"
            exit 1
          fi
          if [ "${{ needs.build-backend.result }}" != "success" ]; then
            echo "Backend build failed"
            exit 1
          fi
          if [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "Frontend build failed"
            exit 1
          fi
          echo "All CI checks passed"

