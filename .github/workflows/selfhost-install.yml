# Monthly clean-VM verification of the self-hosted install.
#
# Treats self-hosting as a product (task §4): every month a FRESH GitHub-hosted
# runner (a clean Ubuntu 24.04 VM) runs scripts/install.sh end-to-end and asserts
# the stack comes up healthy with zero manual steps. Also runs on demand and on
# changes to the install surface so regressions are caught immediately.
name: selfhost-install-verify

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/backup.sh'
      - 'scripts/restore.sh'
      - 'deploy/selfhost/**'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - '.github/workflows/selfhost-install.yml'

jobs:
  clean-vm-install:
    name: install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show tooling
        run: |
          docker --version
          docker compose version
          openssl version

      - name: Run the one-command installer (no manual steps)
        run: |
          chmod +x scripts/install.sh
          # stdout goes to a file rather than the job log: since #328 the
          # installer prints the generated first-administrator password, and a
          # public Actions log is not the place for it. Redacted before echoing.
          if ! ./scripts/install.sh > install.log 2>&1; then
            sed 's/Password: .*/Password: ***REDACTED***/' install.log
            exit 1
          fi
          sed 's/Password: .*/Password: ***REDACTED***/' install.log

      - name: Assert API health
        run: |
          curl -fsS http://localhost:8080/api/v1/health

      # The install is only finished if the operator can actually get in. #328's
      # criterion 1 is exactly this: credentials at the end, not a README telling
      # you to go and make an account. Asserting the printed pair really signs in
      # is what keeps that criterion honest.
      - name: The printed administrator credentials sign in (#328)
        run: |
          email=$(sed -n 's/.*• Email: *//p' install.log | head -1 | tr -d '\r')
          password=$(sed -n 's/.*• Password: *//p' install.log | head -1 | tr -d '\r')
          echo "::add-mask::$password"
          test -n "$email"    || { echo "the installer printed no admin email";    exit 1; }
          test -n "$password" || { echo "the installer printed no admin password"; exit 1; }
          echo "installer printed credentials for $email"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"password\":\"$password\"}")
          echo "POST /auth/login → $code"
          test "$code" = "200"

      # Criterion 3: a second run must not make a second account, and must say so.
      - name: Re-running the installer is idempotent (#328)
        run: |
          if ! ./scripts/install.sh > install2.log 2>&1; then
            sed 's/Password: .*/Password: ***REDACTED***/' install2.log
            exit 1
          fi
          sed 's/Password: .*/Password: ***REDACTED***/' install2.log
          grep -q "Unchanged from your existing install" install2.log || {
            echo "the second run did not report the existing administrator"; exit 1; }

      - name: Assert entitlements endpoint is served (open-core is wired)
        run: |
          # Unauthenticated call must be refused by auth (401/403), NOT 404 —
          # proving the route exists and the plan gates are mounted.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/entitlements || true)
          echo "GET /entitlements → $code"
          test "$code" = "401" -o "$code" = "403"

      - name: Verify backup + restore round-trip
        run: |
          ./scripts/backup.sh
          ls -la backups/
          latest=$(ls -t backups/*.tar.gz | head -1)
          ./scripts/restore.sh "$latest"
          curl -fsS http://localhost:8080/api/v1/health

      - name: Dump logs on failure
        if: failure()
        run: |
          cd deploy/selfhost
          docker compose logs --tail=200 || true

      - name: Tear down
        if: always()
        run: |
          cd deploy/selfhost
          docker compose down -v || true
